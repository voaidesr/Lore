name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build checks
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install Fedora dependencies
        run: |
          dnf -y update
          dnf -y install \
            curl \
            desktop-file-utils \
            file \
            gcc \
            gcc-c++ \
            git \
            gtk3-devel \
            libappindicator-gtk3-devel \
            libxdo-devel \
            librsvg2-devel \
            make \
            nodejs \
            npm \
            openssl-devel \
            pkgconf-pkg-config \
            rust \
            cargo \
            webkit2gtk4.1-devel \
            wget

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
